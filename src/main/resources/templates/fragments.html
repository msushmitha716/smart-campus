<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<style th:fragment="styles">
:root{--primary:#4f46e5;--bg:#f1f5f9;--text:#0f172a;--muted:#64748b}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;color:var(--text);background:var(--bg)}
.layout{display:flex;min-height:100vh}
.sidebar{width:260px;background:#0f172a;color:#cbd5e1;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:24px;font-size:20px;font-weight:700;color:#fff;border-bottom:1px solid #1e293b}
.brand span{color:#818cf8}
.nav{padding:14px 12px;flex:1}
.nav a{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:10px;color:#cbd5e1;text-decoration:none;margin-bottom:4px;font-size:15px;transition:.2s}
.nav a:hover{background:#1e293b;color:#fff}
.nav a.active{background:var(--primary);color:#fff}
.nav .label{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#64748b;padding:14px 14px 6px}
.side-foot{padding:16px;border-top:1px solid #1e293b}
.logout{width:100%;padding:11px;border:1px solid #334155;background:transparent;color:#f1f5f9;border-radius:10px;cursor:pointer;font-size:14px}
.logout:hover{background:#dc2626;border-color:#dc2626}
.main{flex:1;padding:28px 36px;min-width:0}
.main h1{font-size:26px}
.main .sub{color:var(--muted);margin:4px 0 24px}
.panel{background:#fff;border-radius:16px;padding:24px;box-shadow:0 1px 4px rgba(0,0,0,.06);margin-bottom:24px}
.panel h2{font-size:18px;margin-bottom:14px}
.add-form{display:flex;gap:10px;flex-wrap:wrap}
.add-form input{flex:1;min-width:220px;padding:12px 14px;border:1.5px solid #e2e8f0;border-radius:10px;font-size:15px;outline:none}
.add-form input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(79,70,229,.12)}
.btn{padding:12px 22px;border:0;border-radius:10px;background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;font-weight:600;font-size:15px;cursor:pointer}
.btn:hover{box-shadow:0 6px 16px rgba(79,70,229,.35)}
.btn-del{padding:7px 14px;border:1px solid #fecaca;background:#fef2f2;color:#b91c1c;border-radius:8px;cursor:pointer;font-weight:600;font-size:13px}
.btn-del:hover{background:#dc2626;color:#fff;border-color:#dc2626}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);padding:10px 12px;border-bottom:2px solid #e2e8f0}
td{padding:14px 12px;border-bottom:1px solid #f1f5f9}
tr:hover td{background:#f8fafc}
.badge{display:inline-block;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600;background:#eef2ff;color:#4338ca}
.badge.red{background:#fef2f2;color:#b91c1c}
.badge.green{background:#f0fdf4;color:#15803d}
.alert{padding:12px 16px;border-radius:12px;font-size:14px;margin-bottom:18px}
.alert.err{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca}
.alert.ok{background:#f0fdf4;color:#15803d;border:1px solid #bbf7d0}
.empty{text-align:center;color:var(--muted);padding:30px}
@media(max-width:800px){.sidebar{display:none}.main{padding:20px}}
</style>

<aside th:fragment="sidebar(active)" class="sidebar">
    <div class="brand">🎓 Smart <span>Campus</span></div>
    <nav class="nav">
        <div class="label">Menu</div>
        <a th:href="@{/admin/home}">🏠 Dashboard</a>
        <a th:href="@{/}">🚦 Crowd Flow &amp; Mobility</a>
        <div class="label">Administration</div>
        <a th:href="@{/admin/manage/locations}" th:classappend="${active == 'locations'} ? 'active'">📍 Manage Locations</a>
        <a th:href="@{/admin/manage/students}" th:classappend="${active == 'students'} ? 'active'">👥 Registered Students</a>
    </nav>
    <div class="side-foot">
        <form th:action="@{/logout}" method="post">
            <button class="logout" type="submit">⎋ Sign out</button>
        </form>
    </div>
</aside>

</body>
</html>
