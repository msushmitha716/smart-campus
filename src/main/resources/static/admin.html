<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart Campus - Admin Portal</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f6f8;
            color: #222;
        }

        header {
            background: #1f2937;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
        }

        header p {
            margin: 8px 0 0;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 30px auto;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .stat-card h2 {
            margin: 0;
            font-size: 32px;
        }

        .stat-card p {
            margin: 8px 0 0;
            color: #666;
        }

        .section {
            background: white;
            padding: 25px;
            margin-bottom: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .section h2 {
            margin-top: 0;
        }

        .add-area-form {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .add-area-form input {
            flex: 1;
            min-width: 250px;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        .add-area-form button {
            padding: 12px 20px;
            background: #1f2937;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
        }

        .add-area-form button:hover {
            background: #111827;
        }

        #addMessage {
            margin-top: 15px;
            font-weight: bold;
        }

        .locations {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .location-card {
            border: 1px solid #ddd;
            padding: 20px;
            border-radius: 8px;
            position: relative;
        }

        .location-card h3 {
            margin-top: 0;
        }

        .status {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .low {
            background: #d1fae5;
            color: #065f46;
        }

        .moderate {
            background: #fef3c7;
            color: #92400e;
        }

        .high {
            background: #fee2e2;
            color: #991b1b;
        }

        .blocked {
            color: #b91c1c;
            font-weight: bold;
        }

        .normal {
            color: #047857;
            font-weight: bold;
        }

        .delete-button {
            margin-top: 10px;
            padding: 10px 16px;
            background: #b91c1c;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .delete-button:hover {
            background: #991b1b;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #f3f4f6;
        }

        .message {
            text-align: center;
            padding: 20px;
            color: #666;
        }

        @media (max-width: 800px) {
            .stats,
            .locations {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Smart Campus</h1>
    <p>Administrator Portal</p>
</header>

<div class="container">

    <div class="stats">

        <div class="stat-card">
            <h2 id="totalReports">0</h2>
            <p>Total Reports</p>
        </div>

        <div class="stat-card">
            <h2 id="highCongestion">0</h2>
            <p>High Congestion Areas</p>
        </div>

        <div class="stat-card">
            <h2 id="activeLocations">0</h2>
            <p>Active Locations</p>
        </div>

    </div>

    <div class="section">

        <h2>Add New Campus Area</h2>

        <form
            class="add-area-form"
            onsubmit="addLocation(event)">

            <input
                type="text"
                id="locationName"
                placeholder="Enter area name"
                required
            >

            <button type="submit">
                Add Area
            </button>

        </form>

        <div id="addMessage"></div>

    </div>

    <div class="section">

        <h2>Campus Monitoring Dashboard</h2>

        <div id="locations" class="locations">

            <div class="message">
                Loading campus information...
            </div>

        </div>

    </div>

    <div class="section">

        <h2>Recent Reports</h2>

        <table>

            <thead>

                <tr>
                    <th>Location</th>
                    <th>Issue</th>
                    <th>Status</th>
                    <th>Time</th>
                </tr>

            </thead>

            <tbody id="reportsTable">

                <tr>

                    <td
                        colspan="4"
                        class="message">

                        Loading reports...

                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</div>

<script>

async function loadAdminDashboard() {

    try {

        const locationsResponse =
            await fetch("/api/locations");

        const locations =
            await locationsResponse.json();

        displayLocations(locations);

        updateStatistics(locations);

        loadReports();

    } catch (error) {

        console.error(error);

        document.getElementById("locations").innerHTML =
            "<div class='message'>Unable to load campus information.</div>";
    }
}


function displayLocations(locations) {

    const container =
        document.getElementById("locations");

    container.innerHTML = "";

    if (locations.length === 0) {

        container.innerHTML =
            "<div class='message'>No campus locations available.</div>";

        return;
    }

    locations.forEach(location => {

        let statusClass = "low";

        if (location.crowdStatus === "Medium Crowd") {
            statusClass = "moderate";
        }

        if (location.crowdStatus === "High Crowd") {
            statusClass = "high";
        }

        const blockedText =
            location.blocked
                ? "<span class='blocked'>Blocked Pathway</span>"
                : "<span class='normal'>Pathway Clear</span>";

        const card =
            document.createElement("div");

        card.className =
            "location-card";

        card.innerHTML = `

            <h3>${location.name}</h3>

            <div class="status ${statusClass}">
                ${location.crowdStatus}
            </div>

            <p>
                <strong>Total Votes:</strong>
                ${location.totalVotes}
            </p>

            <p>
                <strong>Crowded Reports:</strong>
                ${location.crowdedVotes}
            </p>

            <p>
                <strong>Blocked Reports:</strong>
                ${location.blockedVotes}
            </p>

            <p>
                ${blockedText}
            </p>

            <button
                class="delete-button"
                onclick="deleteLocation(${location.id}, '${location.name.replace(/'/g, "\\'")}')">

                Delete Location

            </button>

        `;

        container.appendChild(card);

    });
}


function updateStatistics(locations) {

    let totalReports = 0;

    let highCongestion = 0;

    locations.forEach(location => {

        totalReports += location.totalVotes;

        if (
            location.crowdStatus === "High Crowd"
            || location.blocked
        ) {
            highCongestion++;
        }

    });

    document.getElementById("totalReports").textContent =
        totalReports;

    document.getElementById("highCongestion").textContent =
        highCongestion;

    document.getElementById("activeLocations").textContent =
        locations.length;
}


async function loadReports() {

    try {

        const response =
            await fetch("/api/reports");

        const reports =
            await response.json();

        const table =
            document.getElementById("reportsTable");

        table.innerHTML = "";

        if (reports.length === 0) {

            table.innerHTML = `
                <tr>
                    <td
                        colspan="4"
                        class="message">

                        No reports available.

                    </td>
                </tr>
            `;

            return;
        }

        reports
            .slice()
            .reverse()
            .slice(0, 10)
            .forEach(report => {

                const row =
                    document.createElement("tr");

                const time =
                    new Date(report.createdAt)
                        .toLocaleString();

                let status = "Reported";

                if (report.issue === "Blocked Pathway") {
                    status = "Blocked";
                }

                if (report.issue === "Crowded Area") {
                    status = "Crowded";
                }

                row.innerHTML = `

                    <td>${report.location}</td>

                    <td>${report.issue}</td>

                    <td>${status}</td>

                    <td>${time}</td>

                `;

                table.appendChild(row);

            });

    } catch (error) {

        console.error(error);

        document.getElementById("reportsTable").innerHTML = `
            <tr>
                <td
                    colspan="4"
                    class="message">

                    Unable to load reports.

                </td>
            </tr>
        `;
    }
}


async function addLocation(event) {

    event.preventDefault();

    const input =
        document.getElementById("locationName");

    const message =
        document.getElementById("addMessage");

    const name =
        input.value.trim();

    if (!name) {
        return;
    }

    try {

        const response =
            await fetch(
                "/api/locations?name="
                + encodeURIComponent(name),
                {
                    method: "POST"
                }
            );

        if (!response.ok) {

            message.textContent =
                "Unable to add area.";

            message.style.color =
                "#b91c1c";

            return;
        }

        message.textContent =
            "Area added successfully.";

        message.style.color =
            "#047857";

        input.value = "";

        loadAdminDashboard();

    } catch (error) {

        console.error(error);

        message.textContent =
            "Unable to add area.";

        message.style.color =
            "#b91c1c";
    }
}


async function deleteLocation(id, name) {

    const confirmed =
        confirm(
            "Are you sure you want to delete " +
            name +
            "?\n\nAll reports for this location will also be deleted."
        );

    if (!confirmed) {
        return;
    }

    try {

        const response =
            await fetch(
                "/api/locations/" + id,
                {
                    method: "DELETE"
                }
            );

        if (!response.ok) {

            alert("Unable to delete location.");

            return;
        }

        alert(
            name +
            " has been deleted successfully."
        );

        loadAdminDashboard();

    } catch (error) {

        console.error(error);

        alert(
            "Unable to delete location."
        );
    }
}


loadAdminDashboard();

</script>

</body>
</html>
